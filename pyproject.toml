[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vizcal", "vizcal.vizcal_utils"]  # Specify the package directories

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[project]
name = "filter-vizcal"
readme = "README.md"
requires-python = ">=3.10, <3.15"
license = "Apache-2.0"

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dynamic = ["version"]

dependencies = [
  # scikit-image 0.25.x has no cp314 wheel; 0.26.0 adds 3.14 wheels but requires-python >=3.11
  # (drops 3.10). Split by interpreter so 3.10–3.13 stay on 0.25.2 and only 3.14 pulls 0.26.
  "scikit-image~=0.25.2; python_version < '3.14'",
  "scikit-image>=0.26.0,<0.27; python_version >= '3.14'",
  "openfilter[all]>=1.3.0,<2.0.0"
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "setuptools>=83.0.0",
  "twine>=6.1.0,<7",
  "wheel>=0.46.2",
  "pytest>=9.0.3",
  "pytest-cov>=6.0.0",
]

[[tool.uv.index]]
name = "openfilter"
url = "https://python.openfilter.io/simple"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
